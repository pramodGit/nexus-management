<div class="nexus-layout">
  <nav class="sidebar">
    <div class="logo">NX</div>
  </nav>

  <main class="content">
    <header>
      <h1>Nexus Core Development</h1>
      <div class="badge">v1.0.0 - Zoneless</div>
      <button class="add-btn" (click)="showForm.set(true)">+ Create Task</button>
    </header>

    @if (showForm()) {
      <app-task-form 
        (onSave)="handleAddTask($event)" 
        (onCancel)="showForm.set(false)">
      </app-task-form>
    }

    <div class="board" cdkDropListGroup>
      @for (status of columns; track status) {
        <div class="column">
          <h3>{{ status | uppercase }}</h3>
          
          <div
            cdkDropList
            [id]="status"
            [cdkDropListData]="board()[status]"
            (cdkDropListDropped)="drop($event, status)"
            class="list">
            
            @for (task of board()[status]; track task.id) {
              <div class="card" cdkDrag [cdkDragData]="task">
                <div class="priority" [attr.data-prio]="task.priority"></div>
                <h4>{{ task.title }}</h4>
                <p>{{ task.description }}</p>
              </div>
            }
          </div>
        </div>
      }
    </div>
  </main>
</div>
